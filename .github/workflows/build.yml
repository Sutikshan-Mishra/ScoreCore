name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "licenses/**"
  pull_request:
  workflow_dispatch:

# One build per ref; a newer push cancels the older run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed to publish the rolling "latest" release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ScoreCore-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/release/app-release.apk dist/ScoreCore.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScoreCore-apk
          path: dist/ScoreCore-*.apk
          if-no-files-found: error

      - name: Publish rolling "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/ScoreCore.apk \
            --title "ScoreCore (latest build)" \
            --notes "Built automatically from ${GITHUB_SHA::7} on push to main. Install ScoreCore.apk on your phone." \
            --target "$GITHUB_SHA" \
            --prerelease
